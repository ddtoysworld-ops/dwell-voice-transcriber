<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D'WELL Voice Transcriber</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <strong>D'WELL 语音转文字</strong>
      <span id="status-dot" aria-hidden="true"></span>
    </header>

    <section id="signed-out">
      <form id="login-form">
        <label>客服邮箱<input id="email" type="email" autocomplete="username" required></label>
        <label>密码<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">登录</button>
      </form>
    </section>

    <section id="signed-in" hidden>
      <p id="identity"></p>
      <p class="hint">打开 WhatsApp 或 Messenger，语音旁会出现“转成文字”。</p>
      <button id="logout" type="button" class="secondary">退出登录</button>
    </section>

    <p id="message" role="status"></p>
  </main>
  <script type="module" src="popup.mjs"></script>
</body>
</html>
